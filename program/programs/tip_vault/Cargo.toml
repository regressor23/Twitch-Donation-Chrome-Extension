[package]
name = "tip_vault"
version = "0.0.0"
description = "TipVault: non-custodial USDC tips for Twitch channels"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "tip_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
# init-if-needed: the vault and both associated token accounts are created
# lazily by whoever tips or claims first.
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = "1.2.0"
# Instruction introspection for attestation checks; anchor_lang re-exports the
# sysvar module but not these loaders.
solana-instructions-sysvar = "3.0.1"

# Anchor's macros expand to cfg checks for features the program does not
# declare; without this the build prints three warnings on every run.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(feature, values("custom-heap", "custom-panic", "anchor-debug"))',
  'cfg(target_os, values("solana"))',
] }
